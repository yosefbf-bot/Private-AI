name: Hardening and release gates
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify conservative scope and gate boundaries
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci_scope.py' -v
      - name: Classify complete change range
        id: classify
        run: python3 .github/scripts/ci_scope.py
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check:secrets
  regression:
    needs: scope
    if: ${{ needs.scope.outputs.mode != 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:repository
      - run: npm run lint
      - run: npm test
      - run: npm run test:hardening
  release-files:
    needs: scope
    if: ${{ needs.scope.outputs.mode != 'docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Build Windows desktop helper
        run: npm run build:helper
      - name: Install Windows runtime cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++-mingw-w64-x86-64-posix cmake ninja-build
      - name: Build checksum-pinned Windows inference runtime
        run: node build/setup-runtime.cjs
      - run: npm run check:release
      - name: Record Windows input hashes
        run: find build/desktop-helper build/local-runtime -type f -print0 | sort -z | xargs -0 sha256sum > build/windows-input-sha256.txt
      - name: Retain source-built Windows packaging inputs
        uses: actions/upload-artifact@v4
        with:
          name: windows-inputs-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            build/desktop-helper/
            build/local-runtime/
            build/windows-input-sha256.txt
  dependencies:
    needs: scope
    if: ${{ needs.scope.outputs.mode != 'docs' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high

  windows-acl:
    needs: scope
    if: ${{ needs.scope.outputs.mode != 'docs' }}
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify actual native private-folder permissions
        run: node --test --test-reporter=tap tests/windows-acl-native.test.cjs

  windows-acceptance:
    needs: [scope, release-files, windows-acl]
    if: ${{ needs.scope.outputs.mode != 'docs' }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Receive same-run genuine Windows native inputs
        uses: actions/download-artifact@v4
        with:
          name: windows-inputs-${{ github.sha }}
          path: build
      - name: Verify every native input before execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content -LiteralPath build/windows-input-sha256.txt
          $approved=[Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($line in $manifest) {
            if ($line -notmatch '^([a-f0-9]{64})  (build/(desktop-helper|local-runtime)/[^\r\n]+)$') { throw 'Invalid native manifest row.' }
            $expected=$Matches[1]; $relative=$Matches[2]
            if (-not $approved.Add($relative.Replace('/',[IO.Path]::DirectorySeparatorChar))) { throw 'Duplicate native input.' }
            $absolute=[IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE $relative))
            $parent=[IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'build'))+[IO.Path]::DirectorySeparatorChar
            if (-not $absolute.StartsWith($parent,[StringComparison]::OrdinalIgnoreCase)) { throw 'Native input path escapes build.' }
            if ((Get-FileHash -LiteralPath $absolute -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Native input hash mismatch.' }
          }
          $actual=Get-ChildItem -LiteralPath build/desktop-helper,build/local-runtime -Recurse -File
          foreach ($file in $actual) {
            if ($file.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Native input link rejected.' }
            $relative=[IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE,$file.FullName)
            if (-not $approved.Remove($relative)) { throw 'Unmanifested native input.' }
          }
          if ($approved.Count -ne 0) { throw 'Missing native inputs.' }
      - run: npm ci --ignore-scripts
      - name: Run the complete Windows source suite and preserve actual TAP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --test --test-reporter=tap --test-concurrency=2 --test-timeout=60000 tests/*.test.cjs 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'privateai-windows-tests.log')
          if ($LASTEXITCODE -ne 0) { throw 'Windows source tests failed.' }
      - name: Exercise actual assistant UI and theme visibility with synthetic Core data
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $edge=Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          if (-not (Test-Path -LiteralPath $edge -PathType Leaf)) { throw 'Actual Windows Edge is required for UI acceptance.' }
          $env:PRIVATE_AI_TEST_CHROMIUM=$edge
          $env:PRIVATE_AI_UI_EVIDENCE=Join-Path $env:RUNNER_TEMP 'privateai-ui-acceptance'
          node tests/assistant-ui-check.cjs 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'privateai-ui-tests.log')
          if ($LASTEXITCODE -ne 0) { throw 'Actual assistant UI acceptance failed.' }
      - name: Build the real installer and freeze candidate hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node build/windows-build.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed.' }
          node build/record-windows-candidate.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Candidate freeze failed.' }
      - name: Download the checksum-pinned public Small model
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node -e "new (require('./source/model-manager.cjs').ModelManager)({directory:require('node:path').join(process.env.LOCALAPPDATA,'PrivateAIModels')}).download('qwen3-1.7b').catch(()=>process.exit(1))"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned public model setup failed.' }
      - name: Execute actual clean installer, installed app and local inference
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          $candidate=Get-Content -LiteralPath ('Validation/'+$version+'/candidate.json') -Raw | ConvertFrom-Json
          ./build/Test-WindowsCandidate.ps1 -Installer $candidate.installer -ExpectedVersion $version -ExpectedInstallerSHA256 $candidate.installerSHA256 -ExpectedExecutableSHA256 $candidate.executableSHA256 -ExpectedArchiveSHA256 $candidate.applicationArchiveSHA256 -CandidateStage (Join-Path $env:GITHUB_WORKSPACE 'dist/win-unpacked') -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'privateai-acceptance') -InstallationDirectory (Join-Path $env:RUNNER_TEMP 'Private AI clean install') -ModelPath (Join-Path $env:LOCALAPPDATA 'PrivateAIModels/Qwen_Qwen3-1.7B-Q4_K_M.gguf') -TestResults (Join-Path $env:RUNNER_TEMP 'privateai-windows-tests.log')
      - name: Retain only hash-bound candidate and sanitized synthetic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-${{ github.sha }}
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 14 || github.event_name == 'pull_request' && 3 || 7 }}
          if-no-files-found: error
          path: |
            dist/PrivateAI-Setup-*.exe
            Validation/*/candidate.json
            Validation/*/candidate-freeze-failure.json
            Validation/*/packaging-baseline.json
            ${{ runner.temp }}/privateai-acceptance/*.json
            ${{ runner.temp }}/privateai-acceptance/clean/*.json
            ${{ runner.temp }}/privateai-acceptance/restart/*.json
            ${{ runner.temp }}/privateai-acceptance/inference/*.json
            ${{ runner.temp }}/privateai-acceptance/reinstall/*.json
            ${{ runner.temp }}/privateai-acceptance/portable/*.json
            ${{ runner.temp }}/privateai-acceptance/*.zip
            ${{ runner.temp }}/privateai-windows-tests.log
            ${{ runner.temp }}/privateai-ui-tests.log
            ${{ runner.temp }}/privateai-ui-acceptance/*.json
            ${{ runner.temp }}/privateai-ui-acceptance/*.png

  ci-gate:
    if: ${{ always() }}
    needs: [scope, secrets, regression, release-files, dependencies, windows-acl, windows-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require the complete selected validation path
        env:
          CI_GATE_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_scope.py --gate
